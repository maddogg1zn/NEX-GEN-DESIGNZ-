<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEX-GEN DESIGNZ</title>
  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-bg: #12161f;
      --accent-blue: #00f0ff;
      --accent-glow: rgba(0, 240, 255, 0.4);
      --text-main: #f0f6fc;
      --border-color: #1f293d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 15px;
      text-align: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    header h1 {
      color: var(--accent-blue);
      font-size: 1.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .container { padding: 15px; max-width: 800px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 15px; }

    .control-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
    }

    label { font-size: 0.8rem; color: #8b949e; display: block; margin-bottom: 4px; }
    input, select, button {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      border-radius: 6px;
      font-size: 0.9rem;
    }
    input:focus, select:focus { border-color: var(--accent-blue); outline: none; }

    button.btn-primary {
      background-color: transparent;
      border: 1px solid var(--accent-blue);
      color: var(--accent-blue);
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      text-shadow: 0 0 5px var(--accent-glow);
    }
    button.btn-primary:hover { background-color: var(--accent-blue); color: #000; }

    .canvas-wrapper {
      background-color: #000;
      border: 2px solid var(--accent-blue);
      border-radius: 8px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    }

    canvas { background-color: #111; max-width: 100%; height: auto; }

    .ai-box {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>NEX-GEN DESIGNZ</h1>
  </header>

  <div class="container">
    <!-- Board Setup Controls -->
    <div class="control-panel">
      <div>
        <label>Board Width (mm)</label>
        <input type="number" id="boardWidth" value="2000">
      </div>
      <div>
        <label>Board Height (mm)</label>
        <input type="number" id="boardHeight" value="640">
      </div>
      <div>
        <label>Primer Background</label>
        <select id="boardBg">
          <option value="#111111">Black Industrial Primer</option>
          <option value="#ffffff">White Gloss</option>
          <option value="#222222">Raw Dibond / Slate</option>
        </select>
      </div>
      <div>
        <label>Grid Scale</label>
        <select id="gridSelect">
          <option value="none">No Grid</option>
          <option value="100">100mm Squares</option>
          <option value="200">200mm Squares</option>
        </select>
      </div>
    </div>

    <!-- Canvas Workspace -->
    <div class="canvas-wrapper">
      <canvas id="signCanvas"></canvas>
    </div>

    <!-- Interactive Layer & AI Controls -->
    <div class="control-panel">
      <div>
        <label>Text Line</label>
        <input type="text" id="textInput" value="NEX-GEN DESIGNZ">
      </div>
      <div>
        <label>Text Color</label>
        <input type="color" id="textColor" value="#00f0ff">
      </div>
      <div>
        <label>Upload Logo/Graphic</label>
        <input type="file" id="imageLoader" accept="image/*">
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button class="btn-primary" onclick="renderBoard()">Redraw Canvas</button>
      </div>
    </div>

    <!-- Gemini AI Assistant -->
    <div class="ai-box">
      <label>AI Design Prompt Assistant</label>
      <input type="text" id="aiPrompt" placeholder="e.g. Suggest high-visibility outdoor colors for black Dibond board">
      <button class="btn-primary" onclick="askGemini()">Ask AI Assistant</button>
      <div id="aiOutput" style="font-size: 0.85rem; color: #a3b3cc; line-height: 1.4; white-space: pre-wrap;"></div>
    </div>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6KIvfniI_2EM0-XytXt_kwtBQcdc9gPa90zWO2VRxFLjA"; // Embedded Key
    const canvas = document.getElementById('signCanvas');
    const ctx = canvas.getContext('2d');
    let uploadedImage = null;

    // Handle Image Uploads
    document.getElementById('imageLoader').addEventListener('change', function(e) {
      const reader = new FileReader();
      reader.onload = function(event) {
        uploadedImage = new Image();
        uploadedImage.onload = function() { renderBoard(); }
        uploadedImage.src = event.target.result;
      }
      reader.readAsDataURL(e.target.files[0]);
    });

    function renderBoard() {
      const w = parseInt(document.getElementById('boardWidth').value) || 2000;
      const h = parseInt(document.getElementById('boardHeight').value) || 640;
      
      // Set canvas scale proportional to real dimensions
      canvas.width = 1000;
      canvas.height = Math.round(1000 * (h / w));

      // Draw Background
      ctx.fillStyle = document.getElementById('boardBg').value;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Uploaded Custom Logo/Image if present
      if (uploadedImage) {
        const imgScale = canvas.height * 0.5;
        const aspect = uploadedImage.width / uploadedImage.height;
        ctx.drawImage(uploadedImage, 30, (canvas.height - imgScale)/2, imgScale * aspect, imgScale);
      }

      // Draw Main Text
      const text = document.getElementById('textInput').value;
      const textColor = document.getElementById('textColor').value;
      ctx.fillStyle = textColor;
      ctx.font = `bold ${Math.round(canvas.height * 0.35)}px 'Segoe UI', sans-serif`;
      ctx.textAlign = uploadedImage ? "left" : "center";
      ctx.textBaseline = "middle";
      
      const textX = uploadedImage ? canvas.width * 0.4 : canvas.width / 2;
      ctx.fillText(text, textX, canvas.height / 2);

      // Draw Scale Grid Overlay
      const gridSetting = document.getElementById('gridSelect').value;
      if (gridSetting !== 'none') {
        const gridSizeMm = parseInt(gridSetting);
        const pxPerMm = canvas.width / w;
        const gridPx = gridSizeMm * pxPerMm;

        ctx.strokeStyle = "rgba(0, 240, 255, 0.4)";
        ctx.lineWidth = 1;

        for (let x = 0; x <= canvas.width; x += gridPx) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y <= canvas.height; y += gridPx) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }
      }
    }

    // Call Gemini API directly
    async function askGemini() {
      const prompt = document.getElementById('aiPrompt').value;
      const outputDiv = document.getElementById('aiOutput');
      if (!prompt) return;

      outputDiv.innerText = "Analyzing design requirements...";

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `You are a professional signwriting design assistant. Answer concisely: ${prompt}` }] }]
          })
        });

        const data = await response.json();
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          outputDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          outputDiv.innerText = "AI Response error. Please verify input.";
        }
      } catch (err) {
        outputDiv.innerText = "Connection error to AI service.";
      }
    }

    // Initial Draw
    renderBoard();
  </script>
</body>
</html>
